<style>
:root {
  --azul-escuro: #000ADC;
  --azul-claro: #00B9FF;
  --laranja: #FF6C00;
  
  --bg-app: #f0f4f9;
  --surface: #ffffff;
  --border: #dbe3ee;
  --text-main: #0c152a;
  --text-muted: #62728d;
  --danger: #dc2626;
  --success: #16a34a;
  
  --radius-lg: 14px;
  --radius-md: 8px;
  --shadow-desktop: 0 10px 30px rgba(0, 0, 0, 0.06);

  --theme-color: var(--azul-claro);
  --theme-hover: #009ce0;
}

body.theme-hub { --theme-color: var(--azul-claro); --theme-hover: #009be0; }
body.theme-material { --theme-color: var(--azul-escuro); --theme-hover: #0008b3; }
body.theme-ferramenta { --theme-color: var(--laranja); --theme-hover: #e05e00; }

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-app);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.3s;
}

/* LOGIN SPLIT */
.login-screen {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #060b26;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 20px;
}

.login-container {
  background: white;
  width: 100%;
  max-width: 960px;
  min-height: 540px;
  border-radius: 20px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
  display: flex;
  overflow: hidden;
  border: 1px solid var(--border);
}

.login-banner {
  flex: 1.1;
  background: linear-gradient(135deg, #020720, var(--azul-escuro));
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
  position: relative;
  overflow: hidden;
  color: white;
}

.banner-brand { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: var(--azul-claro); display: flex; align-items: center; gap: 8px; text-transform: uppercase; z-index: 2; }
.banner-gif-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 0; z-index: 2; }
.banner-gif { max-width: 85%; max-height: 250px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0, 185, 255, 0.25)); }
.banner-footer { z-index: 2; }
.banner-footer h3 { margin: 0 0 6px 0; font-size: 22px; font-weight: 800; color: #ffffff; }
.banner-footer p { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.7); line-height: 1.4; }

.login-box { flex: 1; padding: 48px; display: flex; flex-direction: column; justify-content: center; background: #ffffff; }
.login-box-header { margin-bottom: 28px; }
.login-box-header h2 { margin: 0 0 6px 0; font-size: 26px; font-weight: 800; color: var(--azul-escuro); }
.login-box-header p { margin: 0; font-size: 14px; color: var(--text-muted); }

.login-form { display: flex; flex-direction: column; gap: 18px; }
.login-form .field { display: flex; flex-direction: column; gap: 6px; }
.login-form label { font-size: 12px; font-weight: 800; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 0.5px; }

.login-form input {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  font-size: 14px;
  transition: all 0.2s;
}
